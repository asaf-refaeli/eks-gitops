apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sitelens-database-es
  namespace: sitelens
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: sitelens-db
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: sitelens/database
