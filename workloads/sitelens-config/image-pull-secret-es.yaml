apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr
  namespace: sitelens
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ghcr
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: sitelens/imagepullsecret
        property: username
    - secretKey: password
      remoteRef:
        key: sitelens/imagepullsecret
        property: password
