# Grants the 'viewer' ServiceAccount cluster-wide READ-ONLY access via the
# built-in 'view' ClusterRole. 'view' deliberately excludes Secrets, so this is
# safe to demo with. Swap for 'cluster-admin' only if you knowingly want a
# full-access dashboard in a throwaway lab.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-dashboard-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: viewer
    namespace: kubernetes-dashboard
