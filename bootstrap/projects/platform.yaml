# Argo CD project for platform-level components (Argo CD's own config, and for
# now the example app too). Scoped deliberately: one repo, the namespaces we
# actually deploy into, and only the cluster-scoped kinds we actually need.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    # Projects must exist before the Applications that reference them.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Platform components (Argo CD config, shared tooling).

  sourceRepos:
    - https://github.com/asaf-refaeli/platform.git

  # Any namespace, but only on this cluster. Deliberately a wildcard: the
  # ApplicationSet derives each Application's namespace from its folder name, so
  # pinning namespaces here would mean editing this project for every new
  # workload — defeating the point of the generator. The real guardrail is
  # clusterResourceWhitelist below, which stays an explicit, deliberate list.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"

  # Namespaced resources: unrestricted within the destinations above.
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  # Cluster-scoped resources: allow-list. Covers the Kubernetes Dashboard (its
  # recommended.yaml ships its own Namespace plus a ClusterRole/ClusterRoleBinding)
  # and k9s (Namespace + a ClusterRoleBinding to the built-in `view` role). Add
  # entries here as platform components require them (e.g. CustomResourceDefinition).
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
