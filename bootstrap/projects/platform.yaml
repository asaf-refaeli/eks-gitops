# Argo CD project for platform-level components (Argo CD's own config, and for
# now the example app too). Scoped deliberately: one repo, the namespaces we
# actually deploy into, and only the cluster-scoped kinds we actually need.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    # Projects must exist before the Applications that reference them.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Platform components (Argo CD config, shared tooling).

  sourceRepos:
    - https://github.com/asaf-refaeli/platform.git

  # Any namespace, but only on this cluster. Deliberately a wildcard: the
  # ApplicationSet derives each Application's namespace from its folder name, so
  # pinning namespaces here would mean editing this project for every new
  # workload — defeating the point of the generator. The real guardrail is
  # clusterResourceWhitelist below, which stays an explicit, deliberate list.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"

  # Namespaced resources: unrestricted within the destinations above.
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  # Cluster-scoped resources: the real guardrail — an explicit allow-list that
  # should grow only by deliberate review. Currently covers:
  #   - Kubernetes Dashboard: Namespace, ClusterRole, ClusterRoleBinding
  #   - External Secrets Operator: CustomResourceDefinition (ExternalSecret,
  #     SecretStore, ...) and its ValidatingWebhookConfiguration, plus the
  #     ClusterRoles/Bindings above
  #   - AWS Load Balancer Controller: MutatingWebhookConfiguration, and the
  #     IngressClass / IngressClassParams pair it creates for the "alb" class
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: networking.k8s.io
      kind: IngressClass
    - group: elbv2.k8s.aws
      kind: IngressClassParams
