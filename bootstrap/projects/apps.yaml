# Argo CD project reserved for application workloads. Intentionally empty for
# now: with no sourceRepos and no destinations, nothing can be deployed under
# it yet. This is a placeholder so the structure is in place when real apps
# arrive.
#
# When you add the first app, open it up, e.g.:
#
#   sourceRepos:
#     - https://github.com/asaf-refaeli/platform.git
#   destinations:
#     - server: https://kubernetes.default.svc
#       namespace: my-app
#   namespaceResourceWhitelist:
#     - group: "*"
#       kind: "*"
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Reserved for application workloads — intentionally empty for now.
  sourceRepos: []
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "sitelens"
  clusterResourceWhitelist: []
